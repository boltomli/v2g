[tool.uv]
package = true

[project]
name = "v2g"
version = "0.1.0"
description = "Video to Godot game pipeline powered by LLM"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "yt-dlp>=2024.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
]

[project.scripts]
v2g = "v2g.__main__:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py311"
line-length = 100
